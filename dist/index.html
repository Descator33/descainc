<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c5fb1">
    <meta name="description" content="Desca Inc. — Progetto e realizzo prodotti digitali. Hai un’idea? Parliamone su WhatsApp.">
    <title>Desca Inc. — Prodotti digitali</title>
    <meta property="og:title" content="Desca Inc. — Prodotti digitali">
    <meta property="og:description" content="Ogni progetto inizia con una conversazione. Parliamone.">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/pixelify-sans.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/stazione.webp" as="image" fetchpriority="high">
    <link rel="stylesheet" href="styles.css?v=fullscreen-1">
  </head>
  <body>
    <main class="postcard" aria-labelledby="name">
      <picture class="landscape" aria-hidden="true">
        <source media="(min-aspect-ratio:1/1)" srcset="assets/stazione-wide.webp">
        <img src="assets/stazione.webp" alt="" width="1086" height="1448" fetchpriority="high">
      </picture>
      <svg class="motion-scene" viewBox="0 0 1086 1448" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="cloud-band"><rect x="-1100" y="600" width="6500" height="490"/></clipPath>
          <clipPath id="station-front"><rect y="1090" width="4500" height="358"/><path class="pole-clip" d="M68 966H80L91 1090H65Z"/></clipPath>
        </defs>
        <image class="scene-base" href="assets/stazione-base.webp" width="1086" height="1448"/>
        <g clip-path="url(#cloud-band)">
          <g class="cloud-drift">
            <image href="assets/nuvole.webp" x="-1086" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="0" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="1086" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="2172" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="3258" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="4344" y="640" width="1088" height="466" preserveAspectRatio="none"/>
            <image href="assets/nuvole.webp" x="5430" y="640" width="1088" height="466" preserveAspectRatio="none"/>
          </g>
        </g>
        <image class="scene-base" href="assets/stazione-base.webp" width="1086" height="1448" clip-path="url(#station-front)"/>
        <g class="bird-flight">
          <svg class="bird-sprite" x="0" y="635" width="64" height="64" viewBox="0 0 240 240" overflow="hidden" style="--wing-phase:-0.0s">
            <image class="bird-frames" href="assets/uccello-sprite.webp" width="960" height="240"/>
          </svg>
          <svg class="bird-sprite" x="100" y="600" width="64" height="64" viewBox="0 0 240 240" overflow="hidden" style="--wing-phase:-0.125s">
            <image class="bird-frames" href="assets/uccello-sprite.webp" width="960" height="240"/>
          </svg>
          <svg class="bird-sprite" x="210" y="650" width="64" height="64" viewBox="0 0 240 240" overflow="hidden" style="--wing-phase:-0.25s">
            <image class="bird-frames" href="assets/uccello-sprite.webp" width="960" height="240"/>
          </svg>
          <svg class="bird-sprite" x="310" y="615" width="64" height="64" viewBox="0 0 240 240" overflow="hidden" style="--wing-phase:-0.375s">
            <image class="bird-frames" href="assets/uccello-sprite.webp" width="960" height="240"/>
          </svg>
        </g>
        <g class="train-journey"><image href="assets/treno.webp" y="965" width="1400" height="466.667"/></g>
      </svg>
      <div class="sky-tint" aria-hidden="true"></div>
      <div class="intro">
        <h1 id="name">desca inc.</h1>
        <p class="discipline">PRODOTTI DIGITALI</p>
        <div class="invitation">
          <a class="contact" href="https://wa.me/393356535173?text=Ciao%20Desca%21%20Ho%20un%E2%80%99idea%20per%20un%20progetto%20digitale%2C%20ne%20parliamo%3F" target="_blank" rel="noopener noreferrer">
            <svg class="contact-frame" aria-hidden="true" viewBox="0 0 200 52" preserveAspectRatio="none" fill="none"><path d="M5 1H195V5H199V47H195V51H5V47H1V5H5Z" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
            contatti
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
      <audio id="soundtrack" src="assets/note.mp3" preload="auto" loop></audio>
      <button class="music-toggle" type="button" aria-label="Attiva musica" aria-pressed="false" aria-controls="soundtrack" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3h9v2h-2v10h-2v2H9v-2H7v-2h2v-2h4V6H8v9H6v2H2v-2H0v-2h2v-2h4V3z" fill="currentColor"/><path class="music-off" d="M1 1l17 17" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>musica</span>
      </button>
      <p id="music-status" class="music-status" role="status" aria-live="polite"></p>
      <button class="motion-toggle" type="button" aria-label="Metti in pausa l’animazione" aria-pressed="false" hidden>
        <svg class="pause-symbol" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h3v10H3zm7 0h3v10h-3z"/></svg>
        <svg class="play-symbol" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h2v2h3v2h3v4H9v2H6v2H4z"/></svg>
      </button>
    </main>
    <script src="motion.js?v=fullscreen-1" defer></script>
    <script src="music.js?v=autoplay-1" defer></script>
  </body>
</html>
